# EnglishAI — Tier B deployment (Docker): PostgreSQL 16 + Next.js app
# Usage: docker compose up -d
# Prerequisites: .env.local with DATABASE_URL matching POSTGRES_* below

services:
  postgres:
    image: postgres:16-alpine
    container_name: englishai-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: englishai
      POSTGRES_PASSWORD: englishai
      POSTGRES_DB: englishai
      # C locale keeps initdb fast and matches Tier A embedded PG settings
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englishai -d englishai"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: migrate + seed. Run manually: docker compose run --rm migrate
  migrate:
    image: node:22-alpine
    container_name: englishai-migrate
    working_dir: /app
    profiles: ["tools"]
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://englishai:englishai@postgres:5432/englishai?schema=public
      NODE_OPTIONS: "--max-old-space-size=4096"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run db:seed"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: englishai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://englishai:englishai@postgres:5432/englishai?schema=public
      NODE_OPTIONS: "--max-old-space-size=2048"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
