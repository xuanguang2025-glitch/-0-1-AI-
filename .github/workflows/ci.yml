name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (coverage gate ≥80%)
        run: npx vitest run --coverage

      # CI 不依赖数据库：构建只校验类型与产物（build 前 prisma generate）
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          AUTH_JWT_SECRET: ci-only-secret-not-used-at-runtime-0123456789

      # Playwright 冒烟（需要真实 DB：起 postgres service container）
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER englishai WITH PASSWORD 'englishai' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE englishai OWNER englishai;"

      - name: Migrate + Seed
        run: npx prisma db push && npm run db:seed
        env:
          DATABASE_URL: postgresql://englishai:englishai@localhost:5432/englishai?schema=public

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (production server)
        run: |
          npm run build
          npx next start -p 3000 &
          npx wait-on http://localhost:3000/api/health -t 60000
          PW_SKIP_WEBSERVER=1 npx playwright test
        env:
          DATABASE_URL: postgresql://englishai:englishai@localhost:5432/englishai?schema=public
          AUTH_JWT_SECRET: e2e-secret-key-for-ci-run-only-0123456789

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
